
version = "1.0";

application:
{
  bios:
  {
    // Bare filename is resolved under <base>/<paths.bios_dir>; an
    // absolute path is used as-is. Set skip = true to launch without
    // a BIOS (core jumps straight to the post-BIOS register state).
    path: "dmg_boot.bin",
    skip: false
  }

  paths:
  {
    bios_dir   = "bios"     // BIOS image(s)
    roms_dir   = "roms"     // ROM library (used for --rom bare names + future Load ROM menu)
    savs_dir   = "savs"     // battery-backed SRAM dumps (<fnv1a>.sav)
    sslots_dir = "sslots"   // emulator save-state slots (<fnv1a>_<slot>.state)
  }
};
