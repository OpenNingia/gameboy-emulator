
version = "1.0";

application:
{
  bios:
  {
    // Bare filename is resolved under <base>/<paths.bios_dir>; an
    // absolute path is used as-is. Set skip = true to launch without
    // a BIOS (core jumps straight to the post-BIOS register state).
    path: "dmg_boot.bin",
    skip: false
  }

  paths:
  {
    bios_dir     = "bios"     // BIOS image(s)
    roms_dir     = "roms"     // ROM library (used for --rom bare names + future Load ROM menu)
    savs_dir     = "savs"     // battery-backed SRAM dumps (<fnv1a>.sav)
    sslots_dir   = "sslots"   // emulator save-state slots (<fnv1a>_<slot>.state)
    palettes_dir = "palettes" // user palette files (*.sbp, SameBoy portable format)
  }

  display:
  {
    // LCD response-time simulation. "accurate" weighs the last 5 frames
    // (closest to a real DMG); "simple" averages current + previous;
    // "disabled" passes the PPU framebuffer through unchanged.
    frame_blending = "accurate"

    // Active palette. Built-ins: "grey" / "dmg" / "mgb" / "gbl" (SameBoy
    // RGB values). Any *.sbp file dropped under <base>/<paths.palettes_dir>
    // is also selectable by filename stem. Unknown names fall back to
    // "grey" at boot.
    palette = "dmg"
  }
};
